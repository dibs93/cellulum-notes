<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  
  <!-- MathJax for rendering biochemical & thermodynamic equations -->
  <script>
    MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

  <!-- GOOGLE ADSENSE CODE: Paste your <script async src="https://pagead2.googlesyndication.com/..."> snippet right below this line once ready -->

</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="{{ '/' | relative_url }}" class="brand">
        <span class="brand-main">Cellulum</span> <span class="brand-badge">Notes</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Articles</a>
        <a href="{{ '/resources.html' | relative_url }}">PYQ & Bundles</a>
        <a href="{{ '/about.html' | relative_url }}">About</a>
        <a href="{{ site.main_observatory_url }}" class="btn-observatory" target="_blank" rel="noopener">
          🔬 Interactive Observatory ↗
        </a>
      </nav>
    </div>
  </header>

  <main class="container main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; {{ "now" | date: "%Y" }} Cellulum Notes. Independent Life Sciences Educational Resource.</p>
      <div class="footer-links">
        <a href="{{ '/about.html' | relative_url }}">About Us</a>
        <a href="{{ '/privacy.html' | relative_url }}">Privacy Policy</a>
        <a href="{{ '/contact.html' | relative_url }}">Contact</a>
        <a href="{{ site.main_observatory_url }}">Cellulum Main Site</a>
      </div>
    </div>
  </footer>
</body>
</html>
